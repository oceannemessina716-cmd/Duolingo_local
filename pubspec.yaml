name: duolingo
description: "A new Flutter project."


publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dart_mappable: ^4.6.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  go_router: ^17.1.0
  result_dart: ^2.1.1
  path_provider: ^2.1.5
  flutter_launcher_icons: ^0.14.4
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  get_it: ^9.2.1

  easy_localization: ^3.0.8

  smooth_page_indicator: ^2.0.1
  elegant_notification: ^2.5.1
  flip_card: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.12.2
  dart_mappable_builder: ^4.6.4
  flutter_lints: ^6.0.0



flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:

  uses-material-design: true
  assets:
    - assets/
    - assets/data/
    - assets/translations/
